<!DOCTYPE html>
<!-- Contact page: message form -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send a message to John Rio Ramos.">
  <title>Contact | John Rio Ramos</title>

  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- External stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========== NAVIGATION ========== -->
  <header class="navbar">
    <a href="index.html" class="logo">JRR<span>.</span></a>
    <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">☰</button>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- ========== PAGE HEADER ========== -->
    <section class="page-header">
      <h1>Contact Me</h1>
      <p>Have a question or want to work together? Send me a message!</p>
    </section>

    <!-- ========== CONTACT FORM ========== -->
    <section class="section">
      <form class="contact-form" id="contact-form">

        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="juan@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option>General Question</option>
            <option>Project Collaboration</option>
            <option>Feedback</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>

        <!-- Confirmation message (shown by script.js) -->
        <p class="form-success" id="form-success">✅ Thank you! Your message has been sent.</p>
      </form>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <p>&copy; <span id="year"></span> John Rio Ramos. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
